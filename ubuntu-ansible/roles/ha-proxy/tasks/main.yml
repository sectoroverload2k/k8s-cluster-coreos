---
- block:
  - name: install ha-proxy
    package:
      name: haproxy
      state: latest

  - template:
      src: templates/haproxy.cfg.j2
      dest: /etc/haproxy/haproxy.cfg
      mode: '0644'
      owner: root
      group: root

  - systemd_service:
      name: haproxy
      enabled: true
      state: restarted

  when: ansible_hostname in groups['loadbalancers']
