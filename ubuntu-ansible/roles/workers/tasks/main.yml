---


- name: update grup configs
  block:
  - lineinfile: 
      path: /etc/default/grub
      regexp: '^GRUB_CMDINE_LINUX='
      line: GRUB_CMDLINE_LINUX="systemd.unified_cgroup_hierarchy=0"
    register: grubfile
    notify: "update grup config"

  when: false
  tags: grup


- copy:
    src: files/kubernetes.conf
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: '0644'

- command: "modprobe {{ item }}"
  with_items:
    - overlay
    - br_netfilter

- copy:
    src: files/sysctl-kubernetes.conf
    dest: /etc/sysctl.d/kubernetes.conf
    owner: root
    group: root
    mode: '0644'
  register: sysctlconfig

- command: "sysctl --system"
  when: sysctlconfig.changed


