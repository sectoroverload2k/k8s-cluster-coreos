- name: set hostname
  ansible.builtin.hostname:
    name: '{{ inventory_hostname }}'
  register: changehostname
  notify: "reboot-and-wait"

- name: disable selinux
  lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: SELINUX=disabled
  notify: "reboot-and-wait"
