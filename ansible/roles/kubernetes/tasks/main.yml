- name: reboot after k8 install
  raw: reboot
  when: kubeletinstalled.changed or kubeadminstalled.changed or kubectlinstalled.changed or crioinstalled.changed #or dockerinstalled.changed
  register: k8installed

- name: wait for reboot
#  become: false
  wait_for:
    port: 22
#    host: '{{ (ansible_ssh_host|default(ansible_host))|default(inventory_hostname) }}'
    delay: 10
    timeout: 300
#  connection: local
  when: k8installed.changed

- name: modprobe overlay
  command: modprobe overlay

#- name: modprobe br_netfilter
#  command: br_netfilter

- name: sysctl --system
  command: sysctl --system

- name: start crio service
  ansible.builtin.systemd_service:
    name: crio
    state: started
    enabled: true

- name: start kubelet service
  ansible.builtin.systemd_service:
    name: kubelet
    state: started
    enabled: true

#- name: start docker service
#  ansible.builtin.systemd_service:
#    name: docker
#    state: started
#    enabled: true

- name: Disable SWAP
  command: swapoff -a

- name: disable swap in fstab
  replace:
    path: /etc/fstab
    regexp: '^[^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'
  ignore_errors: true

- name: sysctl kubernetes.conf
  copy: 
    src: files/sysctl.d-kubernetes.conf
    dest: /etc/sysctl.d/kubernetes.conf
    owner: root
    group: root
    mode: '0644'


