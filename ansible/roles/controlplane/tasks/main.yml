---

- name: start crio service
  ansible.builtin.systemd_service:
    name: crio
    state: started
    enabled: true

- name: start kubelet service
  ansible.builtin.systemd_service:
    name: kubelet
    state: started
    enabled: true

- name: copy kubeadm cluster config
  template:
    src: templates/clusterconfig.yml.j2
    dest: /root/clusterconfig.yml
    owner: root
    group: root
    mode: '0644'

- name: init the cluster
  command: kubeadm init --config /root/clusterconfig.yml
  args:
    creates: /etc/kubernetes/admin.conf
  register: clusterinit

- name: setup root .kube dir
  file:
    state: directory
    dest: "~/.kube"
    owner: root
    group: root
    mode: '0755'

- name: copy root k8s admin config
  copy:
    remote_src: true
    src: /etc/kubernetes/admin.conf
    dest: ~/.kube/config
    owner: root
    group: root

- name: fetch k8s admin config
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: configs/k8s-admin.conf
    flat: true


#
# KUBE ROUTER
#
- name: Install kube-router
  block:
    - name: copy kube-router config
      copy:
        src: files/kubeadm-kuberouter.yml
        dest: /root/kubeadm-kuberouter.yml
        owner: root
        group: root
        mode: '0644'
    
    - name: setup kubernetes router
      command: kubectl apply -f /root/kubeadm-kuberouter.yml
      args:
        creates: /etc/cni/net.d/10-kuberouter.conflist
      register: routerinit
  when: k8network == 'kube-router'

#
# FLANNEL NETWORKS
# https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
#
- name: Install flannel networking
  block:
    - name: copy flannel network config
      copy:
        src: files/kube-flannel.yml
        dest: /root/kube-flannel.yml
        owner: root
        group: root
        mode: '0644'

    - name: setup flannel network
      command: kubectl apply -f /root/kube-flannel.yml
      register: flannelinit
  when: k8network == 'flannel'


#
# CALICO NETWORK
# https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
#
- name: Install calico networking
  block:
    - name: copy calico network config
      copy:
        src: files/calico.yml
        dest: /root/calico.yml
        owner: root
        group: root
        mode: '0644'

    - name: setup calico network
      command: kubectl apply -f /root/calico.yml
      register: calicoinit

  when: k8network == 'calico'



