- name: check for python
  raw: which python
  register: whichpython
  changed_when: false
  ignore_errors: true

- name: debug python version
  ansible.builtin.debug:
    var: whichpython
  when: whichpython.stdout

- name: install python for ansible
  raw: rpm-ostree install python
  when: whichpython.failed
  register: pythoninstalled
  notify: "reboot-and-wait"
  ignore_errors: true
  changed_when: "'Changes queued for next boot' in pythoninstalled.stdout"

- name: install mlocate
  raw: rpm-ostree install mlocate
  register: mlocateinstalled
  failed_when: false
  changed_when: "'Changes queued for next boot' in mlocateinstalled.stdout"
  notify: "reboot-and-wait"

- name: reboot
  raw: reboot
  when: pythoninstalled.changed or mlocateinstalled.changed

