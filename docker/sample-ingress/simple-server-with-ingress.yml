---
apiVersion: v1
kind: Service
metadata:
  name: web-server-loadbalancer
  namespace: web
spec:
  selector:
    app: web
  #externalIP: 192.168.128.75
  ports:
    - port: 5000
      targetPort: 80
#  externalIPs:
#    - 192.168.128.32
  type: LoadBalancer



