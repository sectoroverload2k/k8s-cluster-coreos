apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: web
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: httpd
        image: httpd:2.4.48-alpine3.14
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  namespace: web
  labels:
    app: web-server
  name: web-server-service
spec:
#  clusterIP: 192.168.128.141
  ports:
  - nodePort: 31888
    port: 5000
    protocol: TCP
    targetPort: 80
  selector:
    app: web
  type: NodePort
