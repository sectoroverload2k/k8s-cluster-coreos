---
apiVersion: v1
kind: Namespace
metadata:
  name: web

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello-world 
  name: hello-world 
  namespace: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world 
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - image: gcr.io/google-samples/node-hello:1.0
        name: hello-world
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: hello-world
  name: hello-world
  namespace: web
spec:
  type: LoadBalancer
  #externalTrafficPolicy: Local
  ports:
  - name: http
    port: 80
    #targetPort: 8080
  selector:
    app: hello-world
#  externalIPs:
#    - 192.168.128.12

