---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport-service
spec:
  selector:
    app: nginx
  ports: 
    - protocol: TCP
      port: 80
      targetPort: 80
#      nodePort: 80
  type: NodePort
  externalTrafficPolicy: Cluster
  externalIPs:
    - 192.168.128.16
